name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

env:
  # Direct link to the MCA Reborn 1.20.1 jar to compile against (default: 7.6.11).
  # Override it with a repository variable named MCA_JAR_URL (Settings > Secrets and variables > Actions > Variables).
  MCA_JAR_URL: ${{ vars.MCA_JAR_URL || 'https://mediafilez.forgecdn.net/files/6805/928/minecraft-comes-alive-7.6.11%2B1.20.1-universal.jar' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Download MCA Reborn
        run: |
          mkdir -p libs
          code=$(curl -sSL -A "Mozilla/5.0" -o libs/mca-7.7.1.jar -w "%{http_code}" "$MCA_JAR_URL")
          echo "HTTP status: $code"
          if [ "$code" != "200" ] || ! unzip -tq libs/mca-7.7.1.jar > /dev/null; then
            echo "::error::Could not download a valid MCA jar from $MCA_JAR_URL (HTTP $code)"
            head -c 300 libs/mca-7.7.1.jar; echo
            exit 1
          fi
          ls -l libs

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: mca_actions
          path: build/libs/*.jar

      - name: Attach jar to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/libs/*.jar --clobber
